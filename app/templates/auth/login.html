{% extends 'base.html' %}
{% block title %}Sign In — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-20">
  <div class="w-full max-w-md fade-in">
    <!-- Brand header -->
    <div class="text-center mb-8">
      <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="{{ APP_NAME }}"
           class="h-16 w-auto object-contain mx-auto mb-4"
           onerror="this.style.display='none'"/>
      <h1 class="font-display text-3xl font-semibold" style="color:var(--text-primary)">Welcome back</h1>
      <p class="text-muted text-sm mt-1 font-display-italic" style="color:var(--gold)">Sign in to {{ APP_NAME }}</p>
    </div>

    <div class="card rounded-2xl p-8">
      <form method="POST" class="space-y-5">
        <div>
          <label class="text-xs font-semibold text-muted block mb-1.5 uppercase tracking-widest">Email</label>
          <input type="email" name="email" required placeholder="you@example.com"
                 class="w-full card px-4 py-3 rounded-xl text-sm focus:outline-none transition-colors"
                 style="color:var(--text-primary)"
                 onfocus="this.style.borderColor='#C9A84C'" onblur="this.style.borderColor=''"/>
        </div>
        <div>
          <label class="text-xs font-semibold text-muted block mb-1.5 uppercase tracking-widest">Password</label>
          <input type="password" name="password" required placeholder="••••••••"
                 class="w-full card px-4 py-3 rounded-xl text-sm focus:outline-none transition-colors"
                 style="color:var(--text-primary)"
                 onfocus="this.style.borderColor='#C9A84C'" onblur="this.style.borderColor=''"/>
        </div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="remember" class="w-4 h-4" style="accent-color:#C9A84C"/>
          <span class="text-sm text-muted">Remember me</span>
        </label>
        <button type="submit" class="w-full btn-gold py-3.5 rounded-xl text-sm tracking-wide">Sign In</button>
      </form>
    </div>
    <p class="text-center text-sm text-muted mt-6">
      No account?
      <a href="{{ url_for('auth.register') }}" class="font-semibold transition-colors hover:underline" style="color:var(--gold)">Create one free</a>
    </p>
  </div>
</div>
{% endblock %}
