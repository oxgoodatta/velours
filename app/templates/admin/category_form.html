{% extends 'admin/base_admin.html' %}
{% block title %}{% if category %}Edit{% else %}New{% endif %} Category — {{ APP_NAME }}{% endblock %}
{% block admin_content %}
<div class="max-w-lg fade-in">
  <div class="flex items-center gap-3 mb-8">
    <a href="{{ url_for('admin.categories') }}" class="text-muted hover:text-gold-500 text-sm">← Categories</a>
    <span class="text-muted">/</span>
    <h1 class="font-display text-2xl font-bold" style="color:var(--text-primary)">{% if category %}Edit{% else %}New{% endif %} Category</h1>
  </div>
  <div class="card rounded-2xl p-8">
    <form method="POST" class="space-y-5">
      <div>
        <label class="text-xs font-bold text-muted uppercase tracking-wide block mb-1.5">Name *</label>
        <input type="text" name="name" required value="{{ category.name if category else '' }}"
               placeholder="e.g. Social Media Templates"
               class="w-full card px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-gold-500"
               style="color:var(--text-primary)"/>
      </div>
      <div>
        <label class="text-xs font-bold text-muted uppercase tracking-wide block mb-1.5">Icon (emoji)</label>
        <input type="text" name="icon" value="{{ category.icon if category else '📦' }}"
               class="w-full card px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-gold-500 text-2xl"
               style="color:var(--text-primary)"/>
      </div>
      <div>
        <label class="text-xs font-bold text-muted uppercase tracking-wide block mb-1.5">Description</label>
        <textarea name="description" rows="3" placeholder="Brief description..."
                  class="w-full card px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-gold-500 resize-none"
                  style="color:var(--text-primary)">{{ category.description if category else '' }}</textarea>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="btn-gold px-6 py-3 rounded-xl font-bold shadow-gold">
          {% if category %}Save{% else %}Create{% endif %}
        </button>
        <a href="{{ url_for('admin.categories') }}"
           class="card px-6 py-3 rounded-xl text-sm font-semibold text-muted hover:text-gold-500 transition-colors">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
